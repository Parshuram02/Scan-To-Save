<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan-To-Save - Create Profile</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <div class="brand">Scan-To<span class="brand-highlight">-Save</span></div>
            <a href="{{ url_for('index') }}" class="nav-link">Back to Dashboard</a>
        </div>
    </nav>

    <!-- Form Container -->
    <div class="container">
        <div class="form-container">
            <h1>Create Your Profile</h1>

            <form action="{{ url_for('generate_profile') }}" method="POST">
                <input type="hidden" name="template" value="{{ template }}">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div class="form-group">
                    <label for="blood_group">Blood Group</label>
                    <select id="blood_group" name="blood_group" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="purpose">Primary Purpose</label>
                    <select id="purpose" name="purpose" required>
                        <option value="">Select Purpose</option>
                        <option value="Medical ID">Medical ID</option>
                        <option value="Motorcycle Helmet">Motorcycle Helmet</option>
                        <option value="Pet Tag (Dog/Cat)">Pet Tag (Dog/Cat)</option>
                        <option value="General Identification">General Identification</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Password (for viewing sensitive info)</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="emergency_contact">Emergency Contact</label>
                    <input type="text" id="emergency_contact" name="emergency_contact">
                </div>

                <div class="form-group">
                    <label for="medical_conditions">Medical Conditions</label>
                    <textarea id="medical_conditions" name="medical_conditions" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="allergies">Allergies</label>
                    <textarea id="allergies" name="allergies" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="medications">Current Medications</label>
                    <textarea id="medications" name="medications" rows="3"></textarea>
                </div>

                <div class="form-group" style="display: flex; align-items: flex-start; gap: 10px; margin-top: 20px;">
                    <input type="checkbox" id="consent" name="consent" required style="width: auto; margin-top: 5px;">
                    <label for="consent" style="font-size: 0.85rem; color: #666; line-height: 1.4;">
                        I consent to the storage of this medical information for emergency retrieval and understand it will be accessible via QR scan.
                    </label>
                </div>

                <div class="button-container">
                    <button type="submit" class="submit-button">
                        Generate QR Code
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy;2025 Team Codex. </p>
        </div>
    </footer>
</body>
</html>
